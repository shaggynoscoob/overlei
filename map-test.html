<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVERLEI - Spatial Data Overlay Test</title>

    <!-- MapLibre Engine Injection -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        /* Floating Command Dashboard Layout */
        .dashboard-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.9);
            color: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            width: 280px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .dashboard-panel h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            letter-spacing: 0.05em;
            color: #00ffcc;
        }
        .dashboard-panel .subtitle {
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        .layer-control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .layer-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
        }
        .layer-toggle input {
            cursor: pointer;
            accent-color: #00ffcc;
        }
        .status-indicator {
            font-size: 11px;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #334155;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="dashboard-panel">
        <h3>OVERLEI 6.0</h3>
        <div class="subtitle">Spatial Control Console</div>
        
        <div class="layer-control-group">
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-maptiler-roads" checked>
                <span>MapTiler Base Roads</span>
            </label>
            <label class="layer-toggle">
                <input type="checkbox" id="toggle-civic-roads" checked>
                <span>Honolulu Street Centerlines</span>
            </label>
        </div>

        <div class="status-indicator" id="status-display">Console: Ready</div>
    </div>

    <div id="map"></div>

    <script>
        const status = document.getElementById('status-display');

        try {
            const map = new maplibregl.Map({
                container: 'map',
                style: 'https://api.maptiler.com/maps/topo-v4/style.json?key=IOkNcMzIVPtFCaPgyuAa', // Updated to your verified Topo V4 style choice
                center: [-158.0560, 21.6200], 
                zoom: 12.5,
                pitch: 45
            });

            map.on('load', () => {
                status.innerText = "Console: Core Topo Loaded. Fetching GeoJSON...";

                // 1. Activate 3D Terrain Elevation Mesh Mesh
                map.addSource('maptiler-terrain', {
                    type: 'raster-dem',
                    url: 'https://api.maptiler.com/tiles/terrain-rgb-v2/tiles.json?key=IOkNcMzIVPtFCaPgyuAa',
                    tileSize: 256
                });
                map.setTerrain({ source: 'maptiler-terrain', exaggeration: 1.2 });

                // 2. Inject your Local Civic Street Centerlines Dataset
                map.addSource('honolulu-civic-source', {
                    type: 'geojson',
                    data: './mapdata/Street_Centerlines_-8938268975544762819.geojson'
                });

                // 3. Paint the Civic Dataset as a unique Visual Layer (Neon Cyan Line Style)
                map.addLayer({
                    id: 'honolulu-civic-layer',
                    type: 'line',
                    source: 'honolulu-civic-source',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#00ffcc', // Vibrant cyan to stand out against Topo contours
                        'line-width': 2.5,
                        'line-opacity': 0.85
                    }
                });

                status.innerText = "Console: Active Rendering Online";

                // --- UI CONTROL EVENT LISTENERS ---

                // Toggle MapTiler's Default Baseline Roads Layer
                document.getElementById('toggle-maptiler-roads').addEventListener('change', (e) => {
                    // MapTiler style layers containing road graphics typically target ID groups matching 'road' or 'transportation'
                    const targetLayers = map.getStyle().layers.filter(layer => 
                        layer.id.includes('road') || layer.id.includes('transportation')
                    );
                    
                    const visibility = e.target.checked ? 'visible' : 'none';
                    targetLayers.forEach(layer => {
                        map.setLayoutProperty(layer.id, 'visibility', visibility);
                    });
                    status.innerText = `Console: MapTiler Roads set to ${visibility}`;
                });

                // Toggle your custom Honolulu GeoJSON Vector Layer
                document.getElementById('toggle-civic-roads').addEventListener('change', (e) => {
                    const visibility = e.target.checked ? 'visible' : 'none';
                    map.setLayoutProperty('honolulu-civic-layer', 'visibility', visibility);
                    status.innerText = `Console: Civic Centerlines set to ${visibility}`;
                });
            });

            map.on('error', (e) => {
                status.style.color = '#ff3333';
                status.innerText = "Console Error: Map stream blocked.";
                console.error(e);
            });

        } catch (error) {
            console.error("Map system execution failure:", error);
        }
    </script>
</body>
</html>
